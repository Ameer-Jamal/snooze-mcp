name: Bug report
description: Report a reproducible scheduling, installation, or delivery problem.
body:
  - type: markdown
    attributes:
      value: Do not include secrets, your database, private paths, or chat IDs. Use private security reporting for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of snooze-mcp --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and Codex version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, expected behavior, actual behavior, and redacted health/delivery results.
    validations:
      required: true
