name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report

  package:
    name: Lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/snooze-wheel"
          "$RUNNER_TEMP/snooze-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/snooze-wheel/bin/snooze-mcp" --version
          "$RUNNER_TEMP/snooze-wheel/bin/snooze-mcp" --state "$RUNNER_TEMP/snooze-state" add '{"title":"Wheel smoke","delay_seconds":0}'
          "$RUNNER_TEMP/snooze-wheel/bin/snooze-mcp" --state "$RUNNER_TEMP/snooze-state" worker --once
          "$RUNNER_TEMP/snooze-wheel/bin/snooze-mcp" --state "$RUNNER_TEMP/snooze-state" events > "$RUNNER_TEMP/events.json"
          "$RUNNER_TEMP/snooze-wheel/bin/python" -c 'import json; assert json.load(open("events.json"))[0]["status"] == "completed"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
