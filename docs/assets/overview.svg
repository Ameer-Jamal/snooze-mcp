<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Snooze MCP</title>
  <desc id="desc">Schedule a check. Wait without model calls. Wake your agent when ready.</desc>
  <rect width="1200" height="380" rx="24" fill="#111b22"/>
  <circle cx="1070" cy="85" r="140" fill="#739f93" opacity=".07"/>
  <circle cx="1100" cy="80" r="90" fill="none" stroke="#739f93" opacity=".16"/>
  <g transform="translate(52 48)" fill="none" stroke="#a5c9b9" stroke-width="4" stroke-linecap="round">
    <circle cx="26" cy="26" r="24"/>
    <path d="M26 11v16l10 6"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="124" y="83" font-size="44" font-weight="650" fill="#f1f5f3">Snooze MCP</text>
    <text x="54" y="142" font-size="24" fill="#bac6cb">Let the job run. Let the agent rest.</text>
    <g transform="translate(54 198)">
      <rect width="310" height="106" rx="14" fill="#1a2932" stroke="#30444d"/>
      <text x="24" y="38" font-size="13" letter-spacing="2" fill="#a5c9b9">01 / SCHEDULE</text>
      <text x="24" y="73" font-size="21" fill="#f1f5f3">Timer · File · Command</text>
      <path d="M326 53h37m-9-8 9 8-9 8" fill="none" stroke="#739f93" stroke-width="2"/>
      <rect x="380" width="310" height="106" rx="14" fill="#1a2932" stroke="#30444d"/>
      <text x="404" y="38" font-size="13" letter-spacing="2" fill="#a5c9b9">02 / WAIT</text>
      <text x="404" y="73" font-size="21" fill="#f1f5f3">Local checks. No model calls.</text>
      <path d="M706 53h37m-9-8 9 8-9 8" fill="none" stroke="#739f93" stroke-width="2"/>
      <rect x="760" width="280" height="106" rx="14" fill="#20372f" stroke="#5d8777"/>
      <text x="784" y="38" font-size="13" letter-spacing="2" fill="#bce1cc">03 / CONTINUE</text>
      <text x="784" y="73" font-size="21" fill="#f1f5f3">Wake once when ready</text>
    </g>
    <text x="54" y="347" font-size="13" fill="#8a9ea7">Durable SQLite state / Local stdio MCP / Optional Codex delivery</text>
  </g>
</svg>
